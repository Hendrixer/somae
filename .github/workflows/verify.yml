name: Verify Somae

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'
      - name: Install pinned dependencies
        run: bun install --frozen-lockfile
      - name: Verify source, domain rules, and token exports
        run: npm run verify
      - name: Keep verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: somae-verification
          path: artifacts/verification/*.json
          if-no-files-found: warn
