<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Somae launch · Interactive preview</title>
  <style>
    :root { color-scheme:dark; --ink:#15171b; --acid:#e2ff64; --paper:#f3f1e8; --red:#e54831; --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace; }
    * { box-sizing:border-box; }
    html,body { margin:0; background:var(--ink); }
    body { font:13px/1.4 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif; color:#f5f6f0; -webkit-font-smoothing:antialiased; }
    button { font:inherit; }
    button:focus-visible { outline:2px solid var(--acid); outline-offset:3px; }
    .canvas { padding:12px; }
    .toolbar { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:12px; }
    .directions,.devices { display:flex; gap:3px; }
    .control { border:1px solid #373a3d; background:transparent; color:#9a9e9d; padding:7px 12px; cursor:pointer; border-radius:3px; font:10px/1.1 var(--mono); letter-spacing:.04em; transition:background .16s,color .16s,border-color .16s; }
    .control:hover { color:#fff; border-color:#767b76; }
    .control[aria-pressed="true"] { background:var(--acid); border-color:var(--acid); color:var(--ink); }
    .control:disabled { cursor:default; opacity:1; }
    .control:disabled:not([aria-pressed="true"]) { color:#7b7f7d; border-color:#303336; }
    .devices .control { display:grid; place-items:center; width:32px; height:29px; padding:0; }
    .devices .control[aria-pressed="true"] { background:#30343a; border-color:#545a59; color:#f5f6f0; }
    .devices svg { width:15px; height:15px; }
    .preview-wrap { display:flex; justify-content:center; height:266px; background:#0f1114; overflow:hidden; border:1px solid #353839; }
    .preview { width:100%; height:100%; background:var(--acid); color:var(--ink); position:relative; overflow:hidden; transition:width .35s cubic-bezier(.2,.8,.2,1); }
    .preview.device-mobile { width:226px; }
    .site-nav { position:absolute; z-index:2; top:15px; left:20px; right:20px; display:flex; align-items:center; justify-content:space-between; }
    .wordmark { font-size:13px; line-height:1; font-weight:760; letter-spacing:-.6px; }
    .edition { font:8px/1 var(--mono); text-transform:uppercase; letter-spacing:.07em; }
    .hero { position:relative; display:flex; height:100%; padding:55px 20px 18px; isolation:isolate; }
    .hero-copy { position:relative; z-index:2; align-self:center; width:72%; }
    .eyebrow { margin:0 0 9px; font:8px/1.2 var(--mono); letter-spacing:.07em; text-transform:uppercase; }
    h1 { margin:0; font-size:clamp(42px,8.8vw,67px); line-height:.87; font-weight:850; letter-spacing:-4px; }
    .cta { display:inline-flex; align-items:center; justify-content:space-between; gap:22px; border:0; border-radius:0; margin-top:20px; padding:9px 12px; color:var(--acid); background:var(--ink); font:9px/1.1 var(--mono); cursor:pointer; transition:transform .16s,background .16s; }
    .cta:hover { background:#32372b; }
    .cta:active { transform:translateY(1px); }
    .cta:focus-visible { outline-color:var(--ink); }
    .cta svg { width:11px; height:11px; }
    .art { position:absolute; right:-22px; top:37px; width:245px; height:245px; transform:rotate(-13deg); z-index:0; }
    .art svg { display:block; width:100%; height:100%; }
    .art-index { position:absolute; right:12px; bottom:12px; font:8px/1 var(--mono); letter-spacing:.06em; }
    .preview[data-direction="type"] { background:var(--paper); }
    .preview[data-direction="type"] .site-nav { border-bottom:1px solid var(--ink); padding-bottom:10px; }
    .preview[data-direction="type"] .hero { padding-top:65px; }
    .preview[data-direction="type"] h1 { font-size:clamp(40px,7.5vw,60px); line-height:.91; letter-spacing:-3.6px; }
    .preview[data-direction="type"] h1 span { color:var(--red); }
    .preview[data-direction="type"] .art { top:59px; right:13px; width:184px; height:184px; transform:none; }
    .preview[data-direction="type"] .hero-copy { width:76%; }
    .preview[data-direction="type"] .cta { background:transparent; border-top:1px solid var(--ink); padding:9px 0 0; color:var(--ink); gap:35px; }
    .preview[data-direction="type"] .cta:hover { color:var(--red); }
    .device-mobile .site-nav { top:13px; left:14px; right:14px; }
    .device-mobile .edition { font-size:7px; }
    .device-mobile .hero { padding:50px 14px 14px; }
    .device-mobile .hero-copy { align-self:flex-start; width:100%; }
    .device-mobile h1 { font-size:37px; line-height:.9; letter-spacing:-2.2px; }
    .device-mobile .eyebrow { margin-bottom:9px; font-size:7px; }
    .device-mobile .cta { margin-top:17px; font-size:8px; padding:8px 10px; gap:13px; }
    .device-mobile .art { width:120px; height:120px; top:auto; bottom:-30px; right:-12px; }
    .device-mobile .art-index { right:auto; left:14px; bottom:10px; font-size:7px; }
    .preview.device-mobile[data-direction="type"] .hero { padding-top:61px; }
    .preview.device-mobile[data-direction="type"] h1 { font-size:34px; letter-spacing:-2px; line-height:.92; }
    .preview.device-mobile[data-direction="type"] .hero-copy { width:100%; }
    .preview.device-mobile[data-direction="type"] .art { top:auto; bottom:-15px; right:-16px; width:110px; height:110px; }
    .preview.device-mobile[data-direction="type"] .cta { padding-top:8px; padding-left:0; }
    .preview[data-state="joined"] .hero-copy { align-self:center; }
    .preview[data-state="joined"] .art { opacity:.23; }
    .preview[data-state="joined"] h1 { font-size:clamp(42px,8.8vw,67px); }
    .preview.device-mobile[data-state="joined"] h1 { font-size:37px; }
    .metadata { display:flex; justify-content:space-between; gap:12px; padding:10px 0 0; color:#91968f; font:8px/1.2 var(--mono); letter-spacing:.025em; }
    .live { display:flex; align-items:center; gap:6px; }
    .live::before { content:""; width:4px; height:4px; background:var(--acid); }
    #lock-status { color:#aab0a3; }
    @media (max-width:520px) {
      .canvas { padding:10px; }
      .toolbar { margin-bottom:10px; }
      .control { padding:7px 10px; font-size:9px; }
      .preview-wrap { height:310px; }
      .preview:not(.device-mobile) h1 { font-size:46px; letter-spacing:-2.9px; }
      .preview:not(.device-mobile) .hero-copy { width:100%; align-self:flex-start; padding-top:19px; }
      .preview:not(.device-mobile) .art { width:145px; height:145px; right:-26px; top:auto; bottom:-9px; }
      .preview:not(.device-mobile)[data-direction="type"] h1 { font-size:42px; letter-spacing:-2.6px; }
      .preview:not(.device-mobile)[data-direction="type"] .art { width:128px; height:128px; top:auto; bottom:-12px; right:-16px; }
      .preview.device-mobile { width:216px; }
      .device-mobile .art { bottom:0; }
      .preview.device-mobile[data-direction="type"] .art { bottom:-7px; }
      .metadata { font-size:7px; padding-top:9px; }
    }
    @media (prefers-reduced-motion:reduce) { * { transition:none!important; } }
  </style>
</head>
<body>
  <main class="canvas" aria-label="Launch website art direction preview">
    <div class="toolbar">
      <div class="directions" aria-label="Art direction">
        <button class="control" data-direction="volt" aria-pressed="true">01 · Volt</button>
        <button class="control" data-direction="type" aria-pressed="false">02 · Type</button>
      </div>
      <div class="devices" aria-label="Preview device">
        <button class="control" data-device="desktop" aria-pressed="true" aria-label="Desktop preview" title="Desktop preview"><svg viewBox="0 0 18 18" fill="none" aria-hidden="true"><rect x="2" y="3" width="14" height="10" rx="1" stroke="currentColor" stroke-width="1.3"/><path d="M6 16h6M9 13v3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
        <button class="control" data-device="mobile" aria-pressed="false" aria-label="Mobile preview" title="Mobile preview"><svg viewBox="0 0 18 18" fill="none" aria-hidden="true"><rect x="5" y="1.5" width="8" height="15" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M8 13.8h2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
      </div>
    </div>
    <div class="preview-wrap">
      <section class="preview" id="preview" data-direction="volt" data-state="landing" aria-label="Sample Somae launch website">
        <div class="site-nav"><span class="wordmark">somae®</span><span class="edition" id="edition">Human, by design.</span></div>
        <div class="hero">
          <div class="hero-copy"><p class="eyebrow" id="eyebrow">A little space. A lot more possible.</p><h1 id="headline">Make room.<br>Move things.</h1><button class="cta" id="sample-cta"><span id="cta-label">Find your signal</span><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8h10M8 3l5 5-5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"/></svg></button></div>
          <div class="art" id="art" aria-hidden="true"></div>
          <span class="art-index" id="art-index">[ STILL HUMAN. ALWAYS. ]</span>
        </div>
      </section>
    </div>
    <div class="metadata"><span class="live">Interactive preview · sample site</span><span id="lock-status">2 directions</span></div>
  </main>
  <script>
    const directions = new Set(['volt','type']);
    const params = new URLSearchParams(location.search);
    let direction = directions.has(params.get('direction')) ? params.get('direction') : 'volt';
    let locked = params.get('locked') === '1';
    let joined = false;
    let device = 'desktop';
    const preview = document.querySelector('#preview');
    const directionButtons = [...document.querySelectorAll('button[data-direction]')];
    const deviceButtons = [...document.querySelectorAll('button[data-device]')];
    const art = {
      volt: '<svg viewBox="0 0 250 250" fill="none"><path d="M125 0v250M0 125h250M36.6 36.6l176.8 176.8M36.6 213.4 213.4 36.6" stroke="#15171b" stroke-width="35"/><circle cx="125" cy="125" r="43" fill="#e2ff64"/><circle cx="125" cy="125" r="13" fill="#15171b"/></svg>',
      type: '<svg viewBox="0 0 200 200" fill="none"><path d="M18 182 182 18M20 18h162v162" stroke="#e54831" stroke-width="27"/><path d="M17 18h55M182 126v57" stroke="#15171b" stroke-width="2"/><path d="M13 195h174M5 187V13" stroke="#15171b" stroke-width="1"/><circle cx="5" cy="5" r="3" fill="#15171b"/></svg>'
    };
    function render() {
      preview.dataset.direction = direction;
      preview.dataset.state = joined ? 'joined' : 'landing';
      preview.classList.toggle('device-mobile', device === 'mobile');
      directionButtons.forEach(button => {
        button.setAttribute('aria-pressed', String(button.dataset.direction === direction));
        button.setAttribute('aria-disabled', String(locked));
        button.disabled = locked;
      });
      deviceButtons.forEach(button => button.setAttribute('aria-pressed', String(button.dataset.device === device)));
      document.querySelector('#lock-status').textContent = locked ? 'Direction confirmed' : '2 directions';
      document.querySelector('#art').innerHTML = art[direction];
      document.querySelector('#edition').textContent = direction === 'volt' ? 'Human, by design.' : 'Issue 001 / A new pace';
      document.querySelector('#eyebrow').textContent = joined ? 'Preview interaction · no sign-up sent' : direction === 'volt' ? 'A little space. A lot more possible.' : 'For everything waiting on you.';
      document.querySelector('#headline').innerHTML = joined ? "You’re in.<br>Let’s begin." : direction === 'volt' ? 'Make room.<br>Move things.' : 'Less friction.<br><span>More forward.</span>';
      document.querySelector('#cta-label').textContent = joined ? 'Back to the beginning' : direction === 'volt' ? 'Find your signal' : 'Meet Somae';
      document.querySelector('#art-index').textContent = direction === 'volt' ? '[ STILL HUMAN. ALWAYS. ]' : '01 / INTENTION → ACTION';
    }
    directionButtons.forEach(button => button.addEventListener('click', () => {
      if (locked || !directions.has(button.dataset.direction) || direction === button.dataset.direction) return;
      direction = button.dataset.direction;
      joined = false;
      render();
      parent.postMessage({type:'signal-direction', direction}, '*');
    }));
    deviceButtons.forEach(button => button.addEventListener('click', () => { device = button.dataset.device; render(); }));
    document.querySelector('#sample-cta').addEventListener('click', () => { joined = !joined; render(); });
    window.addEventListener('message', event => {
      if (event.source !== parent || event.data?.type !== 'signal-canvas-lock' || typeof event.data.locked !== 'boolean') return;
      locked = event.data.locked;
      render();
    });
    document.addEventListener('keydown', event => {
      if (event.repeat) return;
      const find = (event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'k';
      const create = (event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'n';
      const close = event.key === 'Escape' || (!event.metaKey && !event.ctrlKey && !event.altKey && event.key.toLowerCase() === 'p');
      if (!find && !close && !create) return;
      event.preventDefault();
      parent.postMessage({type:'signal-shortcut', action:create ? 'new-message' : find ? 'find' : 'close'}, '*');
    });
    render();
  </script>
</body>
</html>
