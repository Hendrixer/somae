<!doctype html><html lang="en" data-theme="aura"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Roam · Your stay</title><link rel="stylesheet" href="/packages/design-tokens/tokens.css"><style>*{box-sizing:border-box}body{margin:0;font:12px/1.5 var(--font-body);color:var(--ink);background:var(--surface-raised);padding:17px}h1,h2,p{margin:0}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}header strong{font-size:12px;font-weight:550}header span{font-size:9px;color:var(--ink-muted)}button{font:inherit;color:inherit;cursor:pointer}.hotel{display:flex;align-items:center;gap:10px;text-align:left;padding:13px 11px;border:1px solid transparent;background:var(--surface-inset);border-radius:16px;width:100%;margin:7px 0}.hotel:hover{background:var(--accent-soft)}.hotel{transition:background 160ms,border-color 160ms}.hotel:active{transform:scale(.99)}@media(prefers-reduced-motion:reduce){.hotel{transition:none;transform:none}}.hotel.active{background:var(--accent-soft);border-color:var(--accent-soft)}.radio{width:12px;height:12px;border:1px solid var(--ink-soft);border-radius:50%;display:block;flex-shrink:0}.active .radio{border:4px solid var(--accent);background:var(--surface)}.info{flex:1}.info strong{display:block;font-size:11px;font-weight:550}.info small{font-size:9px;color:var(--ink-muted)}.price{font-size:11px;font-weight:500}.price small{display:block;font-size:8px;font-weight:400;color:var(--ink-muted);text-align:right}.foot{margin:13px 0 0;font-size:9px;color:var(--ink-muted)}.expanded{display:none;margin:22px 0 0;padding:18px;border-radius:12px;background:var(--surface-inset)}.expanded h2{font-size:16px;font-weight:500;margin-bottom:8px}.expanded p{font-size:11px;line-height:1.9;color:var(--ink-muted)}button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}@media(min-width:600px){body{padding:23px}header strong{font-size:16px}.hotel{padding:16px}.info strong{font-size:13px}.info small{font-size:11px}.price{font-size:14px}.expanded{display:block}.foot{font-size:10px}}</style></head><body><header><strong>Austin, at your pace.</strong><span>Nov 7–10 · 3 nights</span></header><div role="group" aria-label="Compare hotels"><button class="hotel" data-hotel="line"><i class="radio"></i><span class="info"><strong>The LINE Austin</strong><small>Lakeside · Walkable · Recommended</small></span><span class="price">$1,486<small>Total</small></span></button><button class="hotel" data-hotel="carpenter"><i class="radio"></i><span class="info"><strong>Carpenter Hotel</strong><small>Quiet courtyard · Neighborhood feeling</small></span><span class="price">$1,248<small>Total</small></span></button><button class="hotel" data-hotel="san"><i class="radio"></i><span class="info"><strong>Hotel San José</strong><small>Garden hideaway · South Congress</small></span><span class="price">$1,362<small>Total</small></span></button></div><p class="foot">All stays include taxes and free cancellation.</p><section class="expanded"><h2>A little room around your plans.</h2><p>Arrive Saturday. Leave Sunday open for the lake, good coffee, or South Congress. Your Monday meetings are close by.</p></section><script>const params=new URLSearchParams(location.search);const theme=params.get('theme');if(['aura','pearl','sage'].includes(theme))document.documentElement.dataset.theme=theme;function select(id,notify=true){document.querySelectorAll('[data-hotel]').forEach(b=>{b.classList.toggle('active',b.dataset.hotel===id);b.setAttribute('aria-pressed',b.dataset.hotel===id);});if(notify)parent.postMessage({type:'hotel-select',hotel:id},'*');}document.querySelectorAll('[data-hotel]').forEach(b=>b.onclick=()=>select(b.dataset.hotel));select(params.get('hotel')||'line',false);window.addEventListener('message',e=>{if(e.source===parent&&e.data?.type==='somae-theme'&&['aura','pearl','sage'].includes(e.data.theme))document.documentElement.dataset.theme=e.data.theme;});</script></body></html>
