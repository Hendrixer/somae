<!doctype html>
<html lang="en" data-theme="electric">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Somae widget</title>
  <link rel="stylesheet" href="/tokens.css">
  <link rel="stylesheet" href="/beacon.css">
  <script src="/beacon.js" type="module"></script>
</head>
<body>
  <div class="beacon-shell">
    <div class="beacon-grip" title="Drag Somae" aria-hidden="true"><span></span><span></span></div>
    <button class="beacon-open" type="button" aria-label="Open Somae" aria-keyshortcuts="Meta+Shift+Space">
      <span class="beacon-hand" aria-hidden="true"></span>
      <span id="beacon-count">Somae</span>
      <kbd aria-hidden="true">⌘ ⇧ Space</kbd>
    </button>
  </div>
</body>
</html>
